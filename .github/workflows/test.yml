name: tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run qagent --help
      - run: npm test
      - run: npm pack
      - run: npx --yes --package ./quant-research-agent-0.1.0.tgz qagent --help
