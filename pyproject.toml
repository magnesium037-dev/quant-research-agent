[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-research-agent"
version = "0.1.0"
description = "Local evidence-driven ETF research agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.0,<3",
    "httpx>=0.27,<1",
    "akshare>=1.18,<2",
    "pandas>=2.2,<3",
    "vectorbt>=0.28,<0.29",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=5,<7",
    "numpy==2.2.6",
    "numba==0.61.2",
    "plotly>=5.24,<6",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "textual>=1,<9",
    "lark-oapi>=1.7,<2",
]

[project.scripts]
qagent = "qagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qagent"]
